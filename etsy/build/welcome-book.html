<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vacation Rental Welcome Book</title>
<style>
@font-face { font-family: "Cormorant Garamond"; src: url("node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Cormorant Garamond"; src: url("node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Cormorant Garamond"; src: url("node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2") format("woff2"); font-weight: 500; font-style: italic; }
@font-face { font-family: "Montserrat"; src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Montserrat"; src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Montserrat"; src: url("node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
:root { --paper: #f6f1ea; --sand: #e9e0d3; --stone: #cbbfae; --olive: #6b6f58; --ink: #2f2d29; --soft: #6e675d; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Montserrat", sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: var(--pw); height: var(--ph); position: relative; overflow: hidden; page-break-after: always; background: var(--paper); padding: .75in .8in .7in; display: flex; flex-direction: column; gap: .32in; }
.page:last-child { page-break-after: auto; }
.eyebrow { font-size: 8.5pt; letter-spacing: .32em; text-transform: uppercase; color: var(--olive); font-weight: 600; }
h1, h2 { font-family: "Cormorant Garamond", serif; font-weight: 500; line-height: 1; }
h2 { font-size: 44pt; }
h3 { font-size: 9pt; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--ink); }
p, li { font-size: 10.5pt; line-height: 1.75; color: var(--soft); }
.serif-i { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; }
.head { display: grid; gap: .12in; }
.rule { width: .6in; height: 1.5px; background: var(--olive); }
.num { position: absolute; bottom: .38in; right: .8in; font-size: 8pt; letter-spacing: .2em; color: var(--stone); }
.brand { position: absolute; bottom: .38in; left: .8in; font-size: 8pt; letter-spacing: .2em; text-transform: uppercase; color: var(--stone); }
.photo { background: var(--sand); border: 1.5px dashed var(--stone); display: grid; place-items: center; color: var(--soft); font-size: 8.5pt; letter-spacing: .2em; text-transform: uppercase; text-align: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .3in .4in; }
.block { display: grid; gap: .08in; align-content: start; }
.card { background: #fff; border-radius: 4px; padding: .25in .28in; display: grid; gap: .08in; align-content: start; }
.big { font-family: "Cormorant Garamond", serif; font-size: 34pt; font-weight: 500; color: var(--ink); line-height: 1.05; }
ul.dots { list-style: none; display: grid; gap: .1in; }
ul.dots li { display: grid; grid-template-columns: .22in 1fr; }
ul.dots li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--olive); margin-top: .62em; }
ul.checks { list-style: none; display: grid; gap: .14in; }
ul.checks li { display: grid; grid-template-columns: .34in 1fr; align-items: start; }
ul.checks li::before { content: ""; width: .17in; height: .17in; border: 1.5px solid var(--olive); border-radius: 3px; margin-top: .25em; }
.place { display: grid; grid-template-columns: 1.2in 1fr; gap: .22in; align-items: center; padding-block: .14in; border-bottom: 1px solid var(--sand); }
.place .photo { height: .95in; font-size: 7pt; }
.place b { font-family: "Cormorant Garamond", serif; font-size: 19pt; font-weight: 600; display: block; color: var(--ink); line-height: 1.1; }
.place span { font-size: 8.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--olive); }
.place p { margin-top: 2px; }
/* cover */
.cover { padding: 0; display: grid; grid-template-rows: 58% 42%; gap: 0; }
.cover .photo { border: 0; border-bottom: 1.5px dashed var(--stone); }
.cover .text { display: grid; align-content: center; justify-items: center; text-align: center; gap: .16in; padding: .4in; }
.cover h1 { font-size: 92pt; letter-spacing: .02em; }
.cover .name { font-size: 11pt; letter-spacing: .4em; text-transform: uppercase; font-weight: 500; }
/* contents */
.toc { list-style: none; display: grid; gap: 0; }
.toc li { display: flex; justify-content: space-between; padding: .12in 0; border-bottom: 1px solid var(--sand); font-size: 11pt; color: var(--ink); }
.toc li span:last-child { color: var(--olive); font-weight: 500; }
.wifi { background: var(--olive); color: #fff; border-radius: 4px; padding: .35in; display: grid; gap: .16in; text-align: center; }
.wifi .eyebrow { color: #e9e0d3; }
.wifi .big { color: #fff; font-size: 30pt; }
.wifi .lbl { font-size: 8.5pt; letter-spacing: .25em; text-transform: uppercase; color: #e9e0d3; }
.emerg .big { font-size: 26pt; }
.qr { width: 1.4in; height: 1.4in; background: #fff; border: 1.5px dashed var(--stone); display: grid; place-items: center; font-size: 7.5pt; letter-spacing: .15em; text-transform: uppercase; color: var(--soft); text-align: center; }
.stars { font-size: 26pt; letter-spacing: .15em; color: var(--olive); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const size = new URLSearchParams(location.search).get("size") || "letter";
document.documentElement.style.setProperty("--pw", size === "a4" ? "210mm" : "8.5in");
document.documentElement.style.setProperty("--ph", size === "a4" ? "297mm" : "11in");
const st = document.createElement("style");
st.textContent = `@page { size: ${size === "a4" ? "A4" : "Letter"}; margin: 0; }`;
document.head.appendChild(st);

let n = 0;
const page = (body, cls = "") => { n++; return `<section class="page ${cls}">${body}<div class="brand">The Olive House</div><div class="num">${String(n).padStart(2, "0")}</div></section>`; };
const head = (eyebrow, title) => `<div class="head"><div class="eyebrow">${eyebrow}</div><h2>${title}</h2><div class="rule"></div></div>`;

const pages = [];
n++;
pages.push(`<section class="page cover"><div class="photo">Add your property photo</div>
  <div class="text"><div class="eyebrow">Guest guide</div><h1>Welcome</h1><div class="name">The Olive House</div><p class="serif-i" style="font-size:17pt;color:var(--ink)">We're so happy you're here</p></div></section>`);

pages.push(page(`${head("Inside this guide", "Contents")}
  <ul class="toc">${[["A note from your host", "03"], ["Check-in & check-out", "04"], ["Wi-Fi & essentials", "05"], ["House rules", "06"], ["How things work", "07"], ["Emergency information", "08"], ["Where to eat", "09"], ["Things to do", "10"], ["Before you leave", "11"], ["Thank you", "12"]]
    .map(([a, b]) => `<li><span>${a}</span><span>${b}</span></li>`).join("")}</ul>`));

pages.push(page(`${head("Hello & welcome", "A note from<br>your host")}
  <div style="display:grid;grid-template-columns:2.4in 1fr;gap:.4in;align-items:start">
    <div class="photo" style="height:3in">Add host photo</div>
    <div class="block"><p>Welcome to The Olive House! We're Sarah and James, and we're thrilled to have you stay with us. We've put together this guide to help you settle in and make the most of your visit.</p>
    <p>Everything you need should be right here, but if anything comes up, please don't hesitate to reach out. We're always just a message away.</p>
    <p class="serif-i" style="font-size:20pt;color:var(--ink);margin-top:.1in">Enjoy your stay,<br>Sarah & James</p></div></div>
  <div class="grid2" style="margin-top:auto">
    <div class="card"><h3>Call or text</h3><p>+1 (555) 123-4567</p></div>
    <div class="card"><h3>Email</h3><p>hello@theolivehouse.com</p></div></div>`));

pages.push(page(`${head("Arrival & departure", "Check-in &<br>check-out")}
  <div class="grid2">
    <div class="card"><h3>Check-in</h3><div class="big">3:00 PM</div><p>Self check-in with the keypad on the front door. Your code will be sent the morning of your arrival.</p></div>
    <div class="card"><h3>Check-out</h3><div class="big">11:00 AM</div><p>Please see the checklist on page 11 before you leave. Late check-out may be available, just ask.</p></div></div>
  <div class="grid2">
    <div class="block"><h3>Parking</h3><p>Free parking for two cars in the driveway. Please don't block the neighbor's entrance.</p></div>
    <div class="block"><h3>Getting in</h3><p>Enter your code and press the lock button. The door locks automatically after 30 seconds.</p></div></div>`));

pages.push(page(`${head("Stay connected", "Wi-Fi &<br>essentials")}
  <div class="wifi"><div class="eyebrow">Wi-Fi</div><div class="lbl">Network</div><div class="big">OliveHouse_Guest</div><div class="lbl">Password</div><div class="big">welcome2026</div></div>
  <div class="grid2">
    <div class="block"><h3>Trash & recycling</h3><p>Bins are on the left side of the house. Trash day is Tuesday morning.</p></div>
    <div class="block"><h3>Extra supplies</h3><p>Towels, sheets and toilet paper are in the hallway closet.</p></div>
    <div class="block"><h3>Thermostat</h3><p>Please keep it between 66°F and 76°F and turn it off when you head out.</p></div>
    <div class="block"><h3>Laundry</h3><p>Washer and dryer in the garage. Detergent is on the shelf above.</p></div></div>`));

pages.push(page(`${head("Please respect our home", "House rules")}
  <ul class="dots">${["No smoking or vaping anywhere on the property", "No parties or events", "Quiet hours from 10:00 PM to 8:00 AM", "Maximum 6 guests at any time", "Pets allowed with prior approval only", "Please remove shoes inside", "Turn off lights and AC when you leave", "Report any damage or breakage, accidents happen"].map(x => `<li>${x}</li>`).join("")}</ul>
  <div class="card" style="margin-top:auto"><h3>Thank you</h3><p>These rules help us keep the house beautiful for you and every guest after you.</p></div>`));

pages.push(page(`${head("A quick how-to", "How things work")}
  <div class="grid2">
    ${[["Smart TV", "Use the white remote. Netflix and YouTube are logged in; please log out of your own accounts before leaving."],
       ["Coffee machine", "Fill the water tank, insert a pod, press the large button. Pods are in the top drawer."],
       ["Air conditioning", "Remote is on the bedroom wall. Press Mode to switch between cool and heat."],
       ["Dishwasher", "Tablets are under the sink. Please start it before you check out."],
       ["Hot tub", "Cover must be closed after use. No glass in or near the tub."],
       ["Fireplace", "Flip the wall switch, then press the remote. Never leave it on unattended."]]
      .map(([a, b]) => `<div class="block"><h3>${a}</h3><p>${b}</p></div>`).join("")}</div>`));

pages.push(page(`${head("Just in case", "Emergency<br>information")}
  <div class="grid2 emerg">
    <div class="card"><h3>Emergency</h3><div class="big">911</div><p>Police, fire, ambulance</p></div>
    <div class="card"><h3>Your host</h3><div class="big">(555) 123-4567</div><p>Available 24/7</p></div>
    <div class="card"><h3>Nearest hospital</h3><p>St. Mary's Medical Center<br>123 Main Street · 10 min drive</p></div>
    <div class="card"><h3>Pharmacy</h3><p>Corner Pharmacy<br>45 Oak Avenue · open until 9 PM</p></div></div>
  <div class="grid2">
    <div class="block"><h3>First aid kit</h3><p>Under the bathroom sink.</p></div>
    <div class="block"><h3>Fire extinguisher</h3><p>Kitchen, next to the fridge.</p></div></div>`));

const places = (list) => list.map(([nm, cat, d]) => `<div class="place"><div class="photo">Photo</div><div><span>${cat}</span><b>${nm}</b><p>${d}</p></div></div>`).join("");
pages.push(page(`${head("Our local favorites", "Where to eat")}
  <div>${places([["The Morning Table", "Breakfast · 5 min", "Best pancakes in town. Go early on weekends."], ["Luna Trattoria", "Italian · 10 min", "Homemade pasta and a cozy patio. Book ahead."], ["Harbor Fish Co.", "Seafood · 12 min", "Fresh catch with a sunset view."], ["Bean & Leaf", "Coffee · 3 min walk", "Great lattes and pastries to go."], ["Golden Crust Pizza", "Pizza · delivers", "Order online, delivery in about 30 minutes."], ["Fresh Market", "Groceries · 5 min", "Everything you need, open daily until 10 PM."]])}</div>`));

pages.push(page(`${head("Explore the area", "Things to do")}
  <div>${places([["Cedar Ridge Trail", "Hiking · 15 min", "An easy 3-mile loop with a waterfall at the end."], ["Old Town Market", "Shopping · 10 min", "Local makers every Saturday, 8 AM to 1 PM."], ["Sunset Beach", "Beach · 20 min", "Quiet, sandy and perfect for an evening walk."], ["Lakeside Kayaks", "Water sports · 18 min", "Rent kayaks and paddle boards by the hour."], ["Vineyard Tour", "Tasting · 25 min", "Afternoon tastings with a view. Reservations recommended."], ["Rainy day?", "Indoors", "Board games and books are in the living room cabinet."]])}</div>`));

pages.push(page(`${head("Before you leave", "Check-out<br>checklist")}
  <ul class="checks">${["Load and start the dishwasher", "Take out all trash and recycling", "Place used towels in the bathtub", "Turn off lights, TV and AC", "Close and lock all windows", "Leave the keys on the kitchen counter", "Lock the front door behind you"].map(x => `<li>${x}</li>`).join("")}</ul>
  <p class="serif-i" style="font-size:18pt;color:var(--ink);margin-top:auto">No need to strip the beds or wash the linens. We'll take care of that.</p>`));

pages.push(page(`${head("Until next time", "Thank you<br>for staying")}
  <p style="max-width:5in">We hope you had a wonderful stay. If you enjoyed your time at The Olive House, a review would mean the world to us and helps other travelers find us.</p>
  <div class="stars">★ ★ ★ ★ ★</div>
  <div style="display:flex;gap:.4in;align-items:center"><div class="qr">Add your<br>QR code</div><p>Scan to leave a review<br>or book your next stay directly.</p></div>
  <p class="serif-i" style="font-size:24pt;color:var(--ink);margin-top:auto">With love, Sarah & James</p>`));

document.getElementById("root").innerHTML = pages.join("");
</script>
</body>
</html>
