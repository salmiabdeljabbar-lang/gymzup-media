<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Date Night & Love Pack</title>
<style>
@font-face { font-family: "Fredoka"; src: url("node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Caveat"; src: url("node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "DM Sans"; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
:root { --cherry: #b3123a; --deep: #5a0f24; --blush: #fbdde3; --pink: #f4a7b6; --cream: #fff8f4; --line: #e9b9c3; --home: #b3123a; --out: #e2577a; --adv: #7a2a4a; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "DM Sans", sans-serif; color: var(--deep); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: var(--pw); height: var(--ph); position: relative; overflow: hidden; page-break-after: always; background: var(--cream); }
.page:last-child { page-break-after: auto; }
.foot { position: absolute; bottom: 0.18in; left: 0; right: 0; text-align: center; font-size: 7.5pt; letter-spacing: .1em; color: #c9a3ab; text-transform: uppercase; }
h1, h2 { font-family: "Fredoka"; font-weight: 600; color: var(--cherry); line-height: 1; }
.script { font-family: "Caveat"; font-weight: 600; }
svg.h { fill: var(--pink); }

/* cover */
.cover { display: grid; place-items: center; text-align: center; }
.cover .frame { position: absolute; inset: .45in; border: 3px solid var(--cherry); border-radius: 28px; }
.cover .frame::after { content: ""; position: absolute; inset: 10px; border: 1.5px dashed var(--pink); border-radius: 20px; }
.cover .inner { position: relative; display: grid; gap: .2in; justify-items: center; }
.cover .small { font-family: "Fredoka"; font-weight: 600; letter-spacing: .3em; font-size: 14pt; color: var(--pink); text-transform: uppercase; }
.cover h1 { font-size: 74pt; line-height: .95; }
.cover .script { font-size: 32pt; }
.cover ul { list-style: none; margin-top: .3in; display: grid; gap: .1in; font-family: "Fredoka"; font-weight: 600; font-size: 15pt; color: var(--deep); }

/* date cards */
.dates { padding: .5in .45in .55in; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .2in; }
.dates header { display: flex; justify-content: space-between; align-items: flex-end; }
.dates header h2 { font-size: 26pt; }
.legend { display: flex; gap: .2in; font-size: 9pt; letter-spacing: .06em; text-transform: uppercase; }
.legend span { display: flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.dgrid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, minmax(0, 1fr)); border-top: 1.3px dashed #d4adb6; border-left: 1.3px dashed #d4adb6; }
.dcell { border-right: 1.3px dashed #d4adb6; border-bottom: 1.3px dashed #d4adb6; padding: .1in; min-height: 0; }
.dcard { height: 100%; border-radius: 14px; background: #fff; border: 2px solid var(--c); display: grid; grid-template-rows: auto 1fr auto; padding: .14in .16in; text-align: center; position: relative; }
.dcard .cat { justify-self: center; font-family: "Fredoka"; font-weight: 600; font-size: 8pt; letter-spacing: .18em; text-transform: uppercase; color: #fff; background: var(--c); padding: 2px 10px; border-radius: 99px; }
.dcard .t { align-self: center; font-family: "Fredoka"; font-weight: 600; font-size: 15pt; line-height: 1.05; color: var(--deep); }
.dcard .d { font-family: "Caveat"; font-weight: 600; font-size: 13.5pt; line-height: 1.05; color: var(--deep); opacity: .85; }

/* reasons */
.reasons { padding: .7in .8in; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: .3in; }
.reasons .head { text-align: center; display: grid; gap: .08in; }
.reasons h2 { font-size: 40pt; }
.reasons .script { font-size: 22pt; }
.rlist { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(10, 1fr); grid-auto-flow: column; column-gap: .4in; }
.rlist div { display: flex; align-items: flex-end; gap: 10px; font-family: "Fredoka"; font-weight: 600; color: var(--cherry); font-size: 12pt; border-bottom: 1.5px solid var(--line); padding-bottom: 4px; }

/* letter */
.letter { padding: .8in .9in; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: .3in; }
.letter .top { display: flex; justify-content: space-between; align-items: flex-end; }
.letter h2 { font-size: 40pt; }
.letter .script { font-size: 26pt; }
.lines { background: repeating-linear-gradient(to bottom, transparent 0, transparent .42in, var(--line) .42in, var(--line) calc(.42in + 1.5px)); }
.sign { justify-self: end; display: grid; gap: .05in; text-align: right; width: 3in; }
.sign .script { font-size: 24pt; }
.sign span { border-bottom: 1.5px solid var(--deep); height: .4in; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><path id="h" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.2 4.5 6 4.5c2.2 0 3.6 1.3 6 3.6 2.4-2.3 3.8-3.6 6-3.6 3.8 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></defs></svg>
<div id="root"></div>
<script>
const size = new URLSearchParams(location.search).get("size") || "letter";
document.documentElement.style.setProperty("--pw", size === "a4" ? "210mm" : "8.5in");
document.documentElement.style.setProperty("--ph", size === "a4" ? "297mm" : "11in");
const st = document.createElement("style");
st.textContent = `@page { size: ${size === "a4" ? "A4" : "Letter"}; margin: 0; }`;
document.head.appendChild(st);
const heart = (style) => `<svg class="h" viewBox="0 0 24 24" style="position:absolute;${style}"><use href="#h"/></svg>`;
const foot = `<div class="foot">Date Night & Love Pack · Printable · Personal use only</div>`;
const C = { home: ["At home", "var(--home)"], out: ["Night out", "var(--out)"], adv: ["Adventure", "var(--adv)"] };
const dates = [
  ["home", "Blanket Fort Movie Night", "pillows, fairy lights and a classic movie"],
  ["home", "Cook Together", "pick a recipe neither of you has tried"],
  ["home", "Game Night", "loser makes breakfast tomorrow"],
  ["home", "Paint & Sip", "paint each other's portrait, no peeking"],
  ["home", "Candlelight Dinner", "phones off, music on"],
  ["home", "Spa Night", "face masks, massages and slow music"],
  ["home", "Memory Lane", "look through old photos and tell the stories"],
  ["home", "Dessert Bake-Off", "each makes a dessert, both are winners"],
  ["out", "Dinner Somewhere New", "a cuisine you've never tried"],
  ["out", "Coffee Shop Crawl", "three cafés, one favorite"],
  ["out", "Bookstore Date", "pick a book for each other"],
  ["out", "Mini Golf", "bragging rights on the line"],
  ["out", "Live Music", "a local band, a small venue"],
  ["out", "Museum Afternoon", "find your favorite piece and say why"],
  ["out", "Dress-Up Dinner", "your fanciest outfits, even if it's pizza"],
  ["out", "Dance Class", "learn a dance together"],
  ["adv", "Sunrise Picnic", "breakfast at the best view in town"],
  ["adv", "Stargazing", "a blanket, hot drinks and the sky"],
  ["adv", "Day Trip", "a town you've never visited"],
  ["adv", "Sunset Hike", "pack snacks, catch the golden hour"],
  ["adv", "Yes Day", "say yes to each other's ideas all day"],
  ["adv", "Photo Walk", "recreate your very first photo together"],
  ["adv", "Try Something New", "a class, a sport, a food: pick one"],
  ["adv", "Mystery Date", "one plans, the other gets surprised"],
];
const chunk = (a, n) => a.reduce((r, x, i) => (i % n ? r[r.length - 1].push(x) : r.push([x]), r), []);
let html = `<section class="page cover"><div class="frame"></div>
  ${heart("width:.5in;top:1.1in;left:1.1in;transform:rotate(-18deg)")}${heart("width:.35in;top:1.9in;right:1.3in")}
  ${heart("width:.6in;bottom:1.3in;right:1.1in;transform:rotate(-8deg)")}${heart("width:.3in;bottom:2.3in;left:1.4in")}
  <div class="inner">
    <svg viewBox="0 0 24 24" style="width:1in;height:1in;fill:var(--cherry)"><use href="#h"/></svg>
    <div class="small">for the two of us</div>
    <h1>Date Night<br>& Love Pack</h1>
    <div class="script">little ideas for big love</div>
    <ul><li>24 date night idea cards</li><li>Reasons I love you</li><li>A love letter for you</li></ul>
  </div></section>`;
chunk(dates, 12).forEach((g, i) => {
  html += `<section class="page dates"><header><h2>Date Night Ideas ${i ? "(2/2)" : "(1/2)"}</h2>
    <div class="legend">${Object.values(C).map(([l, c]) => `<span><i style="background:${c}"></i>${l}</span>`).join("")}</div></header>
    <div class="dgrid">${g.map(([k, t, d]) => `<div class="dcell"><div class="dcard" style="--c:${C[k][1]}">
      <span class="cat">${C[k][0]}</span><div class="t">${t}</div><div class="d">${d}</div></div></div>`).join("")}</div>${foot}</section>`;
});
html += `<section class="page reasons"><div class="head"><h2>Reasons I Love You</h2><div class="script">twenty little reasons, written by me</div></div>
  <div class="rlist">${Array.from({ length: 20 }, (_, i) => `<div>${i + 1}.</div>`).join("")}</div>${foot}</section>`;
html += `<section class="page letter"><div class="top"><h2>A Love Letter</h2><div class="script">for you, Valentine</div></div>
  <div class="lines"></div>
  <div class="sign"><div class="script">with all my love,</div><span></span></div>${foot}</section>`;
document.getElementById("root").innerHTML = html;
</script>
</body>
</html>
