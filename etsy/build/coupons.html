<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Love Coupons</title>
<style>
@font-face { font-family: "Fredoka"; src: url("node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Fredoka"; src: url("node_modules/@fontsource/fredoka/files/fredoka-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Caveat"; src: url("node_modules/@fontsource/caveat/files/caveat-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "DM Sans"; src: url("node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2") format("woff2"); font-weight: 500; }

:root { --cherry: #b3123a; --deep: #5a0f24; --blush: #fbdde3; --pink: #f4a7b6; --cream: #fff8f4; --line: #e9b9c3; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { font-family: "DM Sans", sans-serif; color: var(--deep); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.page { width: var(--pw); height: var(--ph); position: relative; overflow: hidden; page-break-after: always; background: var(--cream); }
.page:last-child { page-break-after: auto; }

/* cover */
.cover { display: grid; place-items: center; text-align: center; }
.cover .frame { position: absolute; inset: 0.45in; border: 3px solid var(--cherry); border-radius: 28px; }
.cover .frame::after { content: ""; position: absolute; inset: 10px; border: 1.5px dashed var(--pink); border-radius: 20px; }
.cover .inner { position: relative; display: grid; gap: 0.18in; justify-items: center; padding: 0 1in; }
.cover .small { font-family: "Fredoka"; font-weight: 600; letter-spacing: .3em; font-size: 15pt; color: var(--pink); text-transform: uppercase; }
.cover h1 { font-family: "Fredoka"; font-weight: 600; font-size: 88pt; line-height: .92; color: var(--cherry); }
.cover .script { font-family: "Caveat"; font-weight: 600; font-size: 34pt; color: var(--deep); }
.cover .fields { margin-top: .35in; display: grid; gap: .22in; width: 4.4in; }
.cover .field { display: flex; align-items: flex-end; gap: 10px; font-family: "Fredoka"; font-weight: 600; font-size: 18pt; color: var(--cherry); }
.cover .field span { flex: 1; border-bottom: 2px solid var(--deep); height: 1.2em; }
.cover .heart-big { width: 1.1in; height: 1.1in; }
.scatter { position: absolute; fill: var(--pink); opacity: .55; }

/* coupon sheet */
.sheet { padding: var(--margin); display: grid; grid-template-rows: repeat(3, 1fr); gap: 0; }
.slot { position: relative; display: grid; place-items: center; }
.slot + .slot::before { content: ""; position: absolute; top: 0; left: -0.2in; right: -0.2in; border-top: 1.5px dashed #c9a3ab; }
.slot + .slot::after { content: "✂"; position: absolute; top: -10px; left: -0.15in; font-size: 14px; color: #c9a3ab; background: var(--cream); padding: 0 3px; font-family: "DejaVu Sans"; }
.coupon { width: 100%; height: calc(100% - 0.36in); position: relative; display: grid; grid-template-columns: 1.25in 1fr; border-radius: 18px; overflow: hidden;
  background: #fff;
  border: 2.5px solid var(--cherry); }
.coupon .stub { background: var(--cherry); color: #fff; display: grid; place-items: center; position: relative; border-right: 2.5px dashed #fff; }
.coupon .stub .no { writing-mode: vertical-rl; transform: rotate(180deg); font-family: "Fredoka"; font-weight: 600; letter-spacing: .25em; font-size: 13pt; }
.coupon .stub .no b { font-size: 26pt; letter-spacing: 0; display: block; }
.coupon .body { padding: 0.22in 0.5in 0.2in 0.38in; display: grid; align-content: center; gap: 6px; position: relative; }
.coupon .kicker { font-family: "Fredoka"; font-weight: 600; letter-spacing: .25em; font-size: 10pt; color: var(--pink); text-transform: uppercase; }
.coupon h2 { font-family: "Fredoka"; font-weight: 600; font-size: var(--title); line-height: 1.02; color: var(--cherry); }
.coupon .desc { font-family: "Caveat"; font-weight: 600; font-size: 19pt; line-height: 1.05; color: var(--deep); }
.coupon .meta { display: flex; gap: .3in; margin-top: 6px; font-size: 9.5pt; letter-spacing: .06em; text-transform: uppercase; color: var(--deep); }
.coupon .meta span { display: flex; align-items: flex-end; gap: 6px; flex: 1; }
.coupon .meta i { flex: 1; border-bottom: 1.4px solid var(--line); height: 1.1em; }
.coupon .corner { position: absolute; right: 0.42in; top: 0.2in; width: .52in; height: .52in; fill: var(--blush); }
.coupon.blank h2 { color: var(--deep); }
.coupon.blank .write { border-bottom: 2px solid var(--line); height: .45in; }

.foot { position: absolute; bottom: 0.18in; left: 0; right: 0; text-align: center; font-size: 7.5pt; letter-spacing: .1em; color: #c9a3ab; text-transform: uppercase; }

/* how-to page */
.howto { padding: 1in; display: grid; align-content: center; gap: .3in; }
.howto h2 { font-family: "Fredoka"; font-weight: 600; font-size: 40pt; color: var(--cherry); }
.howto ol { display: grid; gap: .18in; padding-left: 0; list-style: none; counter-reset: s; }
.howto li { counter-increment: s; display: grid; grid-template-columns: .5in 1fr; gap: .15in; align-items: start; font-size: 14pt; line-height: 1.45; }
.howto li::before { content: counter(s); font-family: "Fredoka"; font-weight: 600; width: .42in; height: .42in; border-radius: 50%; display: grid; place-items: center; background: var(--cherry); color: #fff; font-size: 14pt; }
.howto .note { font-family: "Caveat"; font-weight: 600; font-size: 24pt; color: var(--deep); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs><path id="h" d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2.2 4.5 6 4.5c2.2 0 3.6 1.3 6 3.6 2.4-2.3 3.8-3.6 6-3.6 3.8 0 5.6 3.9 4 7.2C19.5 16.4 12 21 12 21z"/></defs>
</svg>
<div id="root"></div>
<script>
const size = new URLSearchParams(location.search).get("size") || "letter";
const dims = size === "a4" ? { pw: "210mm", ph: "297mm" } : { pw: "8.5in", ph: "11in" };
document.documentElement.style.setProperty("--pw", dims.pw);
document.documentElement.style.setProperty("--ph", dims.ph);
document.documentElement.style.setProperty("--margin", "0.55in 0.6in");
document.documentElement.style.setProperty("--title", "30pt");
const st = document.createElement("style");
st.textContent = `@page { size: ${size === "a4" ? "A4" : "Letter"}; margin: 0; }`;
document.head.appendChild(st);

const heart = (cls, style) => `<svg class="${cls}" viewBox="0 0 24 24" style="${style || ""}"><use href="#h"/></svg>`;
const coupons = [
  ["Breakfast in Bed", "Coffee, pancakes and zero alarms. Served with a kiss."],
  ["Movie Night", "You pick the movie. I bring the snacks and the blanket."],
  ["One Long Massage", "Thirty minutes, no rushing, no complaining."],
  ["Date Night Out", "Dress up, I'll plan it all. Just show up looking cute."],
  ["Dinner Cooked by Me", "Your favorite meal, made with love (and maybe a recipe)."],
  ["No Chores Day", "Dishes, laundry, trash: all mine today."],
  ["Win One Argument", "Use it wisely. I'll say “you're right” and mean it."],
  ["Endless Cuddles", "Unlimited snuggles. No phones allowed."],
  ["Sleep In Pass", "Stay in bed as long as you want. I've got the morning."],
  ["Dessert Run", "Any dessert, any time. I'll go get it."],
  ["Stargazing Night", "A blanket, the night sky and just the two of us."],
  ["One Wish Granted", "Anything you want (within reason, my love)."],
];
const footer = `<div class="foot">Love Coupon Book · Printable · Personal use only</div>`;

let html = "";
// cover
html += `<section class="page cover"><div class="frame"></div>
  ${heart("scatter", "width:.5in;height:.5in;top:1.1in;left:1.1in;transform:rotate(-18deg)")}
  ${heart("scatter", "width:.35in;height:.35in;top:1.8in;right:1.3in;transform:rotate(14deg)")}
  ${heart("scatter", "width:.6in;height:.6in;bottom:1.3in;right:1.1in;transform:rotate(-8deg)")}
  ${heart("scatter", "width:.3in;height:.3in;bottom:2.2in;left:1.4in;transform:rotate(20deg)")}
  <div class="inner">
    <svg class="heart-big" viewBox="0 0 24 24" style="fill:var(--cherry)"><use href="#h"/></svg>
    <div class="small">a little book of</div>
    <h1>Love<br>Coupons</h1>
    <div class="script">redeemable anytime, with love</div>
    <div class="fields"><div class="field">To:<span></span></div><div class="field">From:<span></span></div></div>
  </div></section>`;
// how to use
html += `<section class="page howto">
  <h2>How it works</h2>
  <ol>
    <li>Print the pages at 100% scale on card stock or thick paper.</li>
    <li>Cut along the dashed lines.</li>
    <li>Fill in the names and dates, then staple or tie the coupons into a little book.</li>
    <li>Your Valentine tears out a coupon and hands it to you whenever they want to redeem it.</li>
  </ol>
  <p class="note">The last page has blank coupons for your own ideas. Make it personal.</p>
  ${footer}</section>`;
// coupon pages
const chunk = (a, n) => a.reduce((r, x, i) => (i % n ? r[r.length - 1].push(x) : r.push([x]), r), []);
let n = 0;
chunk(coupons, 3).forEach(group => {
  html += `<section class="page sheet">` + group.map(([t, d]) => {
    n++;
    return `<div class="slot"><div class="coupon">
      <div class="stub"><div class="no">No.<b>${String(n).padStart(2, "0")}</b></div></div>
      <div class="body">${heart("corner")}
        <div class="kicker">This coupon is good for</div>
        <h2>${t}</h2>
        <div class="desc">${d}</div>
        <div class="meta"><span>To<i></i></span><span>Valid until<i></i></span></div>
      </div></div></div>`;
  }).join("") + footer + `</section>`;
});
// blank page
html += `<section class="page sheet">` + [1, 2, 3].map(() => {
  n++;
  return `<div class="slot"><div class="coupon blank">
    <div class="stub"><div class="no">No.<b>${String(n).padStart(2, "0")}</b></div></div>
    <div class="body">${heart("corner")}
      <div class="kicker">This coupon is good for</div>
      <div class="write"></div><div class="write"></div>
      <div class="meta"><span>To<i></i></span><span>Valid until<i></i></span></div>
    </div></div></div>`;
}).join("") + footer + `</section>`;
document.getElementById("root").innerHTML = html;
</script>
</body>
</html>
